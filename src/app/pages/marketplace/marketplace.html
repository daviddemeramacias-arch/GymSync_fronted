<div class="page">
  <div class="grid two">
    <div class="card">
      <h2>Nuevo producto</h2>
      <label for="mname">Nombre</label>
      <input id="mname" [(ngModel)]="prod.name" placeholder="Whey protein 2lb" />

      <label for="mcat">Categoría</label>
      <select id="mcat" [(ngModel)]="prod.category">
        <option *ngFor="let c of categories" [value]="c">{{ categoryLabel(c) }}</option>
      </select>

      <div class="form-row">
        <div>
          <label for="mprice">Precio (USD)</label>
          <input id="mprice" [(ngModel)]="prod.price" type="number" min="0" step="0.5" />
        </div>
        <div>
          <label for="mstock">Stock</label>
          <input id="mstock" [(ngModel)]="prod.stock" type="number" min="0" />
        </div>
      </div>

      <label for="mgym">Gym ID</label>
      <input id="mgym" [(ngModel)]="prod.gym_id" class="mono" />

      <div class="actions">
        <button class="btn" (click)="create()">Crear producto</button>
      </div>
    </div>

    <div class="card">
      <h2>Registrar pedido</h2>
      <p class="muted">Genera un token de pickup de un solo uso.</p>

      <label for="mprod">Producto</label>
      <select id="mprod" [(ngModel)]="order.product_id">
        <option value="">Seleccioná un producto</option>
        <option *ngFor="let p of products" [value]="p.id">{{ p.name }} · {{ money(p.price) }}</option>
      </select>

      <label for="muser">User ID del socio</label>
      <input id="muser" [(ngModel)]="order.user_id" class="mono" placeholder="uuid del socio" />

      <label for="mqty">Cantidad</label>
      <input id="mqty" [(ngModel)]="order.quantity" type="number" min="1" />

      <div class="actions">
        <button class="btn secondary" (click)="orderProduct()">Generar pedido</button>
      </div>

      <p class="banner" [class.error]="isError" [class.ok]="!isError" *ngIf="msg">{{ msg }}</p>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <h2>Catálogo</h2>
      <button class="btn ghost sm" (click)="load()" [disabled]="loading">
        {{ loading ? 'Cargando…' : 'Actualizar' }}
      </button>
    </div>

    <div class="empty" *ngIf="!products.length && !loading">
      <strong>Todavía no hay productos</strong>
      Cargá el primero con el formulario de arriba.
    </div>

    <div class="table-wrap" *ngIf="products.length">
      <table>
        <thead>
          <tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of products">
            <td>{{ p.name }}</td>
            <td>{{ categoryLabel(p.category) }}</td>
            <td>{{ money(p.price) }}</td>
            <td>
              <span class="badge" [class.ok]="p.stock > 5" [class.warn]="p.stock > 0 && p.stock <= 5" [class.bad]="p.stock === 0">
                {{ p.stock }} u.
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
