<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GymSync Socio</title>
  <meta name="description" content="Tu gimnasio en el bolsillo: pase QR, rutinas, tienda y pagos." />
  <meta name="theme-color" content="#4C5E51" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymSync" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./vendor/qrcode.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <div id="offline-banner" class="offline-banner" hidden>Sin conexión · mostrando datos guardados</div>

    <main id="view" class="view"></main>

    <nav id="tabbar" class="tabbar" hidden>
      <button data-view="home" class="tab active"><span>🏠</span>Inicio</button>
      <button data-view="routines" class="tab"><span>🏋️</span>Rutinas</button>
      <button data-view="shop" class="tab"><span>🛒</span>Tienda</button>
      <button data-view="profile" class="tab"><span>👤</span>Perfil</button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
